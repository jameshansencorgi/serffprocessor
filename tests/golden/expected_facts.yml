# The scorer compares numerically, so "25.7" matches an extracted "25.70".
#
# Each anchor: a high-value fact an actuary expects. `key` matches the extracted
# fact's fact_key OR fact_type. `value` is the expected numeric value (percent/factor).
# `table_borne: true` marks anchors that currently require table understanding
# (tracked separately so prose recall isn't penalised by the known table gap).

