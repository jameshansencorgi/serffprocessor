[project]
name = "serff-intel"
version = "0.1.0"
description = "LOCUS-style local corpus/database prototype for public SERFF filings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
serff-intel = "serff_intel.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["serff_intel*"]
